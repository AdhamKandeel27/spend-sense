# Spend Sense: run the production app locally on :5000.
#
#   docker compose up -d --build
#
# The database and files live on Supabase; all settings come from .env
# (DATABASE_URL, DATABASE_URL_DIRECT, NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SECRET_KEY, BETTER_AUTH_SECRET). There is no local database.
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env (Supabase transaction pooler)}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT in .env (Supabase session pooler)}
      RUN_MIGRATIONS: "true"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
    ports:
      - "${APP_PORT:-5000}:3000"
