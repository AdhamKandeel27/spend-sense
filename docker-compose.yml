# Spend Sense — local stack
#
#   docker compose up -d db          # just Postgres, for `pnpm dev`
#   docker compose up -d --build     # Postgres + the production app on :3000
#
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spendsense}
      POSTGRES_DB: ${POSTGRES_DB:-spendsense}
    ports:
      # 5432/5433 are often taken by other local projects.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-spendsense}:${POSTGRES_PASSWORD:-spendsense}@db:5432/${POSTGRES_DB:-spendsense}
      UPLOAD_DIR: /data/uploads
      RUN_MIGRATIONS: "true"
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}  # required — set it in .env (see README)
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
